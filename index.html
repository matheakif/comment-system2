<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>二手閑置交換站 | 潮玩·服裝·電子·其他</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fef9e8 0%, #f4ede4 100%);
            padding: 2rem 1.2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 標題區 */
        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 2.3rem;
            background: linear-gradient(120deg, #c77d3e, #a85d2c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .hero h1::before {
            content: "🔄";
            font-size: 2rem;
            background: none;
            color: #b97f44;
        }

        .hero h1::after {
            content: "♻️";
            font-size: 2rem;
            background: none;
            color: #c58a54;
        }

        .sub {
            color: #7e5a42;
            margin-top: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        /* 表單卡片 */
        .form-card {
            background: white;
            border-radius: 36px;
            padding: 1.6rem 2rem;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
            border: 1px solid #f3e1cf;
            transition: 0.2s;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            align-items: flex-end;
        }

        .input-group {
            flex: 2;
            min-width: 170px;
        }

        .input-group label {
            display: block;
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #b35f2b;
            margin-bottom: 6px;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 28px;
            border: 1.5px solid #f0dfcf;
            background: #fffdfa;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }

        .input-group textarea {
            border-radius: 24px;
            resize: vertical;
            min-height: 70px;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: #c98954;
            box-shadow: 0 0 0 3px rgba(201, 137, 84, 0.2);
        }

        .btn-primary {
            background: #c47a44;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 44px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: #a56132;
            transform: scale(0.97);
        }

        /* 過濾欄 */
        .filter-bar {
            background: white;
            border-radius: 60px;
            padding: 0.6rem 1.6rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.03);
            border: 1px solid #f1e0d0;
        }

        .filter-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group span {
            font-weight: 700;
            color: #9b5e34;
            font-size: 0.85rem;
        }

        .filter-btn {
            background: #f6ede5;
            border: none;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #8b5633;
        }

        .filter-btn.active {
            background: #c47a44;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .filter-btn:hover:not(.active) {
            background: #e7d5c6;
        }

        /* 卡片列表 - 雜誌風格 */
        .records-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .exchange-card {
            background: white;
            border-radius: 32px;
            overflow: hidden;
            transition: all 0.2s ease;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid #f3e2d4;
            display: flex;
            flex-direction: column;
        }

        .exchange-card.done {
            background: #faf6f1;
            opacity: 0.82;
            border-left: 6px solid #b8a28e;
            filter: grayscale(0.02);
        }

        .card-inner {
            padding: 1.4rem 1.4rem 1.2rem;
            flex: 1;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .category-badge {
            background: #f7ede4;
            padding: 5px 14px;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 800;
            color: #b9622c;
        }

        .status-badge {
            font-size: 0.65rem;
            background: #eae1d8;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 700;
        }

        .status-badge.active {
            background: #e0cdbb;
            color: #8b4a22;
        }

        .status-badge.done {
            background: #d6cbbc;
            color: #6f5843;
            text-decoration: line-through;
        }

        .content-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 12px 0 8px;
            color: #573c28;
            line-height: 1.3;
            word-break: break-word;
        }

        .message-text {
            background: #fef6ef;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #6d4c32;
            margin: 10px 0 14px;
            border-left: 3px solid #d69d6e;
            word-break: break-word;
        }

        .meta-info {
            font-size: 0.7rem;
            color: #b49273;
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            border-top: 1px dashed #f0dfcf;
            padding-top: 10px;
        }

        .card-action {
            margin-top: 14px;
        }

        .toggle-btn {
            background: #f0e2d6;
            border: none;
            width: 100%;
            padding: 10px 0;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.1s;
            color: #a1623a;
        }

        .toggle-btn:hover {
            background: #e2cfbe;
            color: #784a28;
        }

        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 48px;
            color: #b48762;
            font-size: 1rem;
        }

        footer {
            text-align: center;
            margin-top: 2.8rem;
            font-size: 0.7rem;
            color: #c2a184;
        }

        @media (max-width: 680px) {
            body {
                padding: 1rem;
            }
            .form-card {
                padding: 1.2rem;
            }
            .filter-bar {
                border-radius: 36px;
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1>二手閑置交換站</h1>
        <div class="sub">分享你的潮玩、服裝、電子設備｜讓閑置重生</div>
    </div>

    <!-- 新增表單 -->
    <div class="form-card">
        <div class="form-row">
            <div class="input-group" style="flex: 2;">
                <label>📦 閑置內容 (必填)</label>
                <input type="text" id="contentInput" placeholder="例：全新未拆盲盒 / 二手復古外套" autocomplete="off">
            </div>
            <div class="input-group" style="flex: 1.2;">
                <label>🏷️ 分類</label>
                <select id="categorySelect">
                    <option value="潮玩">潮玩</option>
                    <option value="服裝">服裝</option>
                    <option value="電子設備">電子設備</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="input-group" style="flex: 2;">
                <label>💬 留言 / 交換條件 (可選)</label>
                <textarea id="messageInput" rows="1" placeholder="想交換什麼？或者備註物品狀況..."></textarea>
            </div>
            <div class="input-group" style="flex: 0 0 auto;">
                <button class="btn-primary" id="submitBtn">✨ 發布交換物</button>
            </div>
        </div>
    </div>

    <!-- 過濾器 -->
    <div class="filter-bar">
        <div class="filter-group">
            <span>🔍 篩選狀態：</span>
            <button data-status-filter="all" class="filter-btn active">全部</button>
            <button data-status-filter="active" class="filter-btn">進行中 (active)</button>
            <button data-status-filter="done" class="filter-btn">已完成 (done)</button>
        </div>
        <div class="filter-group">
            <span>♻️ 點擊卡片按鈕可切換狀態</span>
        </div>
    </div>

    <!-- 卡片渲染容器 -->
    <div id="listContainer" class="records-grid">
        <div class="empty-message">🌟 目前還沒有閑置物品，快來發布第一個交換物吧～</div>
    </div>
    <footer>📀 資料同步於 Google Sheet · 支援離線 localStorage 備份</footer>
</div>

<script>
    // ======================== BACKEND CONFIGURATION ========================
    // Google Apps Script Web App URL
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygCO2C1pObxCe5lkwtfPBtkBVzZzn5dEd5N8IiHvY2I335UAzPW-jzcxaJpZFj80Nm/exec";
    
    // ======================== DATA CONTRACT ========================
    /**
     * 二手閑置交換網站 - 資料合約 (Record 結構)
     * @typedef {Object} ExchangeRecord
     * 
     * @property {string} id          - 唯一識別碼 (使用 timestamp + 隨機字串)
     * @property {string} createdAt   - 建立時間，ISO 字串 (new Date().toISOString())
     * @property {string} status       - 狀態: 'active' 或 'done', 預設 'active'
     * @property {string} content      - 閑置內容 (物品標題/名稱)，必填
     * @property {string} category     - 分類，只能是 '潮玩' / '服裝' / '電子設備' / '其他'
     * @property {string} message      - 留言 / 備註 (可選，可能為空)
     */

    // ---------- 全域變數 ----------
    let recordsArray = [];            // 儲存所有交換紀錄
    let currentStatusFilter = 'all';  // 'all', 'active', 'done'

    // DOM 元素
    const listContainer = document.getElementById('listContainer');
    const contentInput = document.getElementById('contentInput');
    const categorySelect = document.getElementById('categorySelect');
    const messageInput = document.getElementById('messageInput');
    const submitBtn = document.getElementById('submitBtn');

    // ---------- 輔助函式 ----------
    function generateId() {
        return Date.now() + '-' + Math.random().toString(36).substring(2, 10);
    }

    // 防止 XSS 攻擊
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // 格式化顯示時間 (從 ISO 轉為 月/日 時:分)
    function formatDateTime(isoString) {
        if (!isoString) return '日期錯誤';
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return '無效時間';
        return `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    }

    // ======================== BACKEND CONNECTOR FUNCTIONS ========================
    
    /**
     * 1. syncToSheet(payload)
     * 使用 fetch POST 到 APPS_SCRIPT_URL，同步資料到 Google Sheet
     * @param {Object} payload - { action, record?, id?, changes? }
     * @returns {Promise<Object>} - 回傳 API 回應
     */
    async function syncToSheet(payload) {
        try {
            const response = await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });
            console.log("syncToSheet 已送出:", payload);
            return { ok: true, message: "Request sent (no-cors mode)" };
        } catch (err) {
            console.error("syncToSheet 錯誤:", err);
            return { ok: false, error: err.message };
        }
    }

    /**
     * 2. fetchRecordsFromSheet()
     * 使用 GET fetch(APPS_SCRIPT_URL) 讀取所有紀錄
     * @returns {Promise<Array>} - 回傳紀錄陣列 (已正規化)
     */
    async function fetchRecordsFromSheet() {
        try {
            const response = await fetch(APPS_SCRIPT_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (!data.ok) throw new Error(data.error || "API 回傳錯誤");
            const records = (data.records || []).map(normalizeRecord);
            return records;
        } catch (err) {
            console.error("fetchRecordsFromSheet 錯誤:", err);
            throw err;
        }
    }

    /**
     * 3. normalizeRecord(record)
     * 將 Sheet 回傳的欄位對應回前端 key
     * 支援大小寫轉換 (ID -> id, CreatedAt -> createdAt, Status -> status)
     * @param {Object} record - 從 Sheet 讀取的原始紀錄
     * @returns {Object} - 正規化後的前端紀錄
     */
    function normalizeRecord(record) {
        if (!record) return {};
        return {
            id: record.id || record.ID || "",
            createdAt: record.createdAt || record.CreatedAt || new Date().toISOString(),
            status: record.status || record.Status || "active",
            content: record.content || record.Content || "",
            category: record.category || record.Category || "其他",
            message: record.message || record.Message || ""
        };
    }

    // ---------- 核心函式 (修改版) ----------

    function createRecord(formData) {
        if (!formData.content || formData.content.trim() === '') {
            throw new Error('請填寫閑置內容！');
        }
        const validCategories = ['潮玩', '服裝', '電子設備', '其他'];
        const finalCategory = validCategories.includes(formData.category) ? formData.category : '其他';

        return {
            id: generateId(),
            createdAt: new Date().toISOString(),
            status: 'active',
            content: formData.content.trim(),
            category: finalCategory,
            message: formData.message ? formData.message.trim() : '',
        };
    }

    function saveData(record) {
        recordsArray.unshift(record);
        localStorage.setItem('records', JSON.stringify(recordsArray));
        syncToSheet({ action: "create", record: record }).catch(err => {
            console.warn("同步到 Sheet 失敗 (create):", err);
        });
    }

    async function loadData() {
        try {
            const remoteRecords = await fetchRecordsFromSheet();
            if (remoteRecords && remoteRecords.length >= 0) {
                remoteRecords.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                recordsArray = remoteRecords;
                localStorage.setItem('records', JSON.stringify(recordsArray));
                console.log(`從 Sheet 載入 ${recordsArray.length} 筆資料`);
                return recordsArray;
            }
        } catch (remoteErr) {
            console.warn("從 Sheet 讀取失敗，使用 localStorage 備份:", remoteErr);
        }
        
        const stored = localStorage.getItem('records');
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                const cleaned = parsed.map(item => ({
                    id: item.id || generateId(),
                    createdAt: item.createdAt || new Date().toISOString(),
                    status: (item.status === 'active' || item.status === 'done') ? item.status : 'active',
                    content: item.content || '(無標題)',
                    category: ['潮玩', '服裝', '電子設備', '其他'].includes(item.category) ? item.category : '其他',
                    message: item.message || '',
                }));
                recordsArray = cleaned;
                return recordsArray;
            } catch(e) {
                console.error("載入 localStorage 失敗", e);
                recordsArray = [];
                return [];
            }
        } else {
            recordsArray = [];
            return [];
        }
    }

    function updateRecord(id, changes) {
        const index = recordsArray.findIndex(r => r.id === id);
        if (index === -1) return false;
        
        recordsArray[index] = { ...recordsArray[index], ...changes };
        localStorage.setItem('records', JSON.stringify(recordsArray));
        
        syncToSheet({ action: "update", id: id, changes: changes }).catch(err => {
            console.warn("同步到 Sheet 失敗 (update):", err);
        });
        
        return true;
    }

    function renderList(recordsToShow) {
        if (!listContainer) return;
        if (!recordsToShow || recordsToShow.length === 0) {
            listContainer.innerHTML = `<div class="empty-message">🍃 沒有符合狀態的交換物，試試不同篩選或新增閑置～</div>`;
            return;
        }

        const sorted = [...recordsToShow].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        const cardsHTML = sorted.map(record => {
            const isDone = record.status === 'done';
            const cardClass = isDone ? 'exchange-card done' : 'exchange-card';
            const statusText = isDone ? '✅ 已完成 (done)' : '🔄 進行中 (active)';
            const statusClass = isDone ? 'status-badge done' : 'status-badge active';
            const buttonText = isDone ? '♻️ 恢復 active' : '🏷️ 標記 done';
            const newStatusValue = isDone ? 'active' : 'done';

            let categoryIcon = '';
            if (record.category === '潮玩') categoryIcon = '🧸';
            else if (record.category === '服裝') categoryIcon = '👕';
            else if (record.category === '電子設備') categoryIcon = '📱';
            else categoryIcon = '🎁';

            return `
                <div class="${cardClass}" data-record-id="${record.id}">
                    <div class="card-inner">
                        <div class="card-top">
                            <span class="category-badge">${categoryIcon} ${escapeHtml(record.category)}</span>
                            <span class="${statusClass}">${statusText}</span>
                        </div>
                        <div class="content-title">📦 ${escapeHtml(record.content)}</div>
                        ${record.message ? `<div class="message-text">💬 ${escapeHtml(record.message)}</div>` : `<div class="message-text" style="background:#faf3ea; color:#b6835b;">📝 沒有留下留言，直接詢問交換～</div>`}
                        <div class="meta-info">
                            <span>🕒 ${formatDateTime(record.createdAt)}</span>
                            <span>🆔 ${record.id.slice(-6)}</span>
                        </div>
                        <div class="card-action">
                            <button class="toggle-btn" data-action="toggleStatus" data-id="${record.id}" data-newstatus="${newStatusValue}">
                                ${buttonText}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        listContainer.innerHTML = cardsHTML;

        document.querySelectorAll('[data-action="toggleStatus"]').forEach(btn => {
            btn.removeEventListener('click', handleToggleStatus);
            btn.addEventListener('click', handleToggleStatus);
        });
    }

    function handleToggleStatus(e) {
        const btn = e.currentTarget;
        const id = btn.getAttribute('data-id');
        const newStatus = btn.getAttribute('data-newstatus');
        if (!id || !newStatus) return;
        if (newStatus === 'active' || newStatus === 'done') {
            updateRecord(id, { status: newStatus });
            applyFilterAndRender();
        }
    }

    function getFilteredRecords() {
        let filtered = [...recordsArray];
        if (currentStatusFilter !== 'all') {
            filtered = filtered.filter(record => record.status === currentStatusFilter);
        }
        filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        return filtered;
    }

    function applyFilterAndRender() {
        const filtered = getFilteredRecords();
        renderList(filtered);
    }

    function updateFilterButtonsUI() {
        document.querySelectorAll('[data-status-filter]').forEach(btn => {
            const filterVal = btn.getAttribute('data-status-filter');
            if (filterVal === currentStatusFilter) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    function bindFilterEvents() {
        const statusBtns = document.querySelectorAll('[data-status-filter]');
        statusBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const value = btn.getAttribute('data-status-filter');
                if (value === 'all' || value === 'active' || value === 'done') {
                    currentStatusFilter = value;
                    updateFilterButtonsUI();
                    applyFilterAndRender();
                }
            });
        });
    }

    function addExchangeItem() {
        const content = contentInput.value;
        const category = categorySelect.value;
        const message = messageInput.value;

        try {
            const formData = { content, category, message };
            const newRecord = createRecord(formData);
            saveData(newRecord);
            contentInput.value = '';
            messageInput.value = '';
            currentStatusFilter = 'all';
            updateFilterButtonsUI();
            applyFilterAndRender();
            contentInput.focus();
        } catch (err) {
            alert(err.message);
        }
    }

    async function init() {
        await loadData();
        bindFilterEvents();
        submitBtn.addEventListener('click', () => {
            addExchangeItem();
        });
        contentInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addExchangeItem();
            }
        });
        applyFilterAndRender();
    }

    init();
</script>
</body>
</html>
